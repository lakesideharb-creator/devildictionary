<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Editor’s Desk</title>
    <link rel="stylesheet" href="/community.css" />
    <script type="module" src="/editor.js"></script>
  </head>
  <body>
    <main>
      <nav><a href="/community.html">← Community Edition</a></nav>
      <header>
        <p class="eyebrow">PRIVATE EDITOR’S DESK</p>
        <h1>A little editorial judgment.</h1>
      </header>
      <p id="notice" role="status"></p>
      <form id="login">
        <label for="password">Editor password</label
        ><input
          id="password"
          type="password"
          autocomplete="current-password"
          required
          maxlength="200"
        /><button>SIGN IN</button>
      </form>
      <section id="desk" hidden>
        <div class="toolbar">
          <label for="status">Show</label
          ><select id="status">
            <option value="pending">Pending</option>
            <option value="approved">Published</option>
            <option value="rejected">Rejected</option>
            <option value="removed">Removed</option></select
          ><button id="logout">SIGN OUT</button>
        </div>
        <div id="entries"></div>
        <div class="actions">
          <button id="previous">PREVIOUS</button><button id="next">NEXT</button>
        </div>
        <h2>Reader reports</h2>
        <div id="reports"></div>
      </section>
    </main>
  </body>
</html>
